name: EnthusiaStaff visibility verification
on:
  pull_request:
    branches: [master]
  push:
    branches: [fix/enthusiastaff-vanish]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source without publishing
        run: ./gradlew clean test shadowJar spotlessCheck --no-daemon
